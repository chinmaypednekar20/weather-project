# Apache Flume Configuration for Simulated Real-Time NOAA Event Ingestion
# Agent Name: weather_agent

weather_agent.sources = s_netcat
weather_agent.channels = c_memory
weather_agent.sinks = k_hdfs

# -------------------------------------------------------------
# Source: Netcat socket source listening for incoming NOAA events
# -------------------------------------------------------------
weather_agent.sources.s_netcat.type = netcat
weather_agent.sources.s_netcat.bind = 127.0.0.1
weather_agent.sources.s_netcat.port = 44444
weather_agent.sources.s_netcat.channels = c_memory

# -------------------------------------------------------------
# Channel: In-memory event buffer
# -------------------------------------------------------------
weather_agent.channels.c_memory.type = memory
weather_agent.channels.c_memory.capacity = 10000
weather_agent.channels.c_memory.transactionCapacity = 1000

# -------------------------------------------------------------
# Sink: HDFS Sink writing events to /weather/streaming/
# -------------------------------------------------------------
weather_agent.sinks.k_hdfs.type = hdfs
weather_agent.sinks.k_hdfs.channel = c_memory
weather_agent.sinks.k_hdfs.hdfs.path = hdfs://localhost:9000/weather/streaming
weather_agent.sinks.k_hdfs.hdfs.filePrefix = noaa_stream_event
weather_agent.sinks.k_hdfs.hdfs.fileSuffix = .log
weather_agent.sinks.k_hdfs.hdfs.fileType = DataStream
weather_agent.sinks.k_hdfs.hdfs.writeFormat = Text
weather_agent.sinks.k_hdfs.hdfs.rollInterval = 10
weather_agent.sinks.k_hdfs.hdfs.rollSize = 1048576
weather_agent.sinks.k_hdfs.hdfs.rollCount = 50
weather_agent.sinks.k_hdfs.hdfs.batchSize = 10
weather_agent.sinks.k_hdfs.hdfs.useLocalTimeStamp = true
